<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <title>My Queue — MyTurn</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="queue" data-roles="USER" data-title="My Queue" data-active="queue">

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="app-content">
        <div class="page-head">
          <div class="crumbs">
            <a href="user-dashboard.html">Dashboard</a>
            <span class="sep">/</span>
            <span>My Queue</span>
          </div>
          <h1>My Queue</h1>
          <p class="text-muted">Track your live position and get to the counter right on time.</p>
        </div>

        <!-- Live queue view (rendered by queue.js) -->
        <div id="queueRoot"></div>

        <!-- Empty state: no active token -->
        <div class="card" id="queueEmpty">
          <div class="empty-state">
            <span class="empty-icon">
              <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 2 2 0 0 0 0-4Z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15 6v12" stroke="currentColor" stroke-width="2"/></svg>
            </span>
            <h4>You're not in any queue</h4>
            <p>Take a digital token from a service center and it'll show up here for live tracking.</p>
            <a class="btn mt-2" href="user-dashboard.html#find">Find a service</a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/command-menu.js"></script>
</body>
</html>
