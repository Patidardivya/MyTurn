  <!-- Arrow tip on arc -->
  <path d="M5 13 L6 16 L9 14.5" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- MT monogram -->
  <text x="16" y="21" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">MT</text>
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
